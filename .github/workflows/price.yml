name: Daily price log

on:
  schedule:
    - cron: "30 4 * * 1-5"   # 04:30 UTC = 10:00 IST, Mon-Fri
  workflow_dispatch:           # lets you run it manually to test

permissions:
  contents: write              # needed so the job can commit the CSV

jobs:
  log:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - run: pip install yfinance

      - run: python price_monitor.py --once --csv prices.csv

      - name: Commit the CSV
        run: |
          git config user.name "price-bot"
          git config user.email "price-bot@users.noreply.github.com"
          git add prices.csv
          git diff --cached --quiet || (git commit -m "Log prices $(date -u +%F)" && git push)
